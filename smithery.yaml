runtime: "container"
build:
  dockerfile: "Dockerfile"           # Path to your Dockerfile
  dockerBuildPath: "."               # Docker build context
startCommand:
  type: "http"
  port: 8080
  configSchema:                      # JSON Schema for configuration
    required: 
      - apiKey
    type: object
    properties:
      apiKey:
        type: string
        description: Required OpenBB PAT used to authenticate requests
  exampleConfig:
    apiKey: sk-example123
